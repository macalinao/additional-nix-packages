# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit is free for public/open-source repositories.
# Install the app once at https://github.com/apps/coderabbitai
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master
  path_filters:
    # Lock files are machine-generated — no review signal there.
    - "!flake.lock"
  tools:
    # Lint the GitHub Actions workflows and any shell snippets in derivations.
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
chat:
  auto_reply: true
